# GoReleaser config — https://goreleaser.com
# Release: push a tag like v0.1.0 → .github/workflows/release.yml runs this.
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: nexus

before:
  hooks:
    - go mod tidy

builds:
  - id: nexus
    main: ./cmd/nexus
    binary: nexus
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: nexus
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README*.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: "Yangi imkoniyatlar"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Tuzatishlar"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Boshqa"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^Merge "

release:
  prerelease: auto
  footer: |
    To'liq o'zgarishlar ro'yxati: [CHANGELOG.md](https://github.com/xamrayev/nexus-cli/blob/main/CHANGELOG.md)
